{% extends "layout.html" %}

{% block content %}
  <h1>Prediction result</h1>
  <p>
    <strong>Prediction:</strong> 
    <span style="color: {% if prediction == 'Spam' %}red{% else %}green{% endif %}; font-weight: bold;">
      {{ prediction }}
    </span>
  </p>
  <p>
    <strong>Confidence:</strong> 
    {% if prediction == 'Spam' %}
      {{ "%.1f"|format(confidence * 100) }}%
    {% else %}
      {{ "%.1f"|format((1 - confidence) * 100) }}%
    {% endif %}
  </p>
  <p><a href="{{ url_for('main.index') }}">Classify another message</a></p>
{% endblock %}
